# Private, loopback-only gateway for the single canonical Django CFG example.
# Do not publish this origin directly; external previews require Cloudflare Access.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 5s;
  map $http_upgrade $upgrade_connection { default upgrade; '' close; }
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $upgrade_connection;
  proxy_read_timeout 300s;
  proxy_buffering off;
  map $host $allowed_host {
    default 0;
    localhost 1;
    127.0.0.1 1;
    gateway 1;
  }

  upstream django_upstream { zone django_upstream 64k; server api:8000 resolve; }
  upstream demo_upstream { zone demo_upstream 64k; server demo:3010 resolve; }
  upstream docs_upstream { zone docs_upstream 64k; server docs:3778 resolve; }
  upstream storybook_upstream { zone storybook_upstream 64k; server storybook:6017 resolve; }

  # Forward only to internal Compose services, preserving HMR websocket upgrades.
  server {
    listen 8080;
    server_name localhost 127.0.0.1 gateway;
    if ($allowed_host = 0) { return 421; }
    location ~ ^/(api|cfg|healthz|admin|static|staticfiles|media)(/|$) {
      proxy_pass http://django_upstream;
    }
    location / {
      proxy_pass http://demo_upstream;
    }
  }
  server {
    listen 8081;
    server_name localhost 127.0.0.1 gateway;
    if ($allowed_host = 0) { return 421; }
    location / {
      proxy_pass http://docs_upstream;
    }
  }
  server {
    listen 8082;
    server_name localhost 127.0.0.1 gateway;
    if ($allowed_host = 0) { return 421; }
    location / {
      proxy_pass http://storybook_upstream;
    }
  }
  server {
    listen 8083;
    server_name localhost 127.0.0.1 gateway;
    if ($allowed_host = 0) { return 421; }
    location / {
      proxy_pass http://django_upstream;
    }
  }
}
