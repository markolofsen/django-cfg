[tool.pytest.ini_options]
# Merged from the former pytest.ini (the version pytest actually used).
# Coverage is opt-in: run `pytest --cov=django_cfg --cov-report=term-missing`
# (requires the `test` extra / pytest-cov). It is intentionally NOT in addopts
# so the bare `pytest` command works without pytest-cov installed.
DJANGO_SETTINGS_MODULE = "tests.settings"
# Both test trees: `tests/` (cross-cutting) and `src/` (per-module suites
# beside the code). Applies only to a bare `pytest` — an explicit path
# argument REPLACES this list, so the Makefile targets name the same pair
# in TESTS_STANDALONE/TESTS_INLINE. Change both together.
testpaths = ["tests", "src"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*", "*Tests"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --import-mode=importlib"
norecursedirs = ["tests_archived", "__pycache__", ".git", ".pytest_cache", "build", "dist", "*.egg-info", "@*", ".*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "core: marks tests as core framework tests",
    "django_db: marks tests that require database access",
]
# No line may name a Django warning class: a class removed by a newer Django
# (RemovedInDjango61Warning on 6.1) makes pytest exit at start. The blanket
# `DeprecationWarning:django` ignore stays for local runs; CI's `strict-warnings`
# job overrides this list and fails on RemovedInDjango2028Warning.
filterwarnings = [
    "ignore::DeprecationWarning:pydantic",
    "ignore::DeprecationWarning:django",
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
    "ignore:`min_items` is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/django_cfg"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"


[tool.hatch.build.targets.wheel]
packages = [ "src/django_cfg",]
exclude = [
    # internal / non-shippable — mirror the sdist target (SECRETS-001: keep secrets/@dev out of the wheel)
    "@*",
    "**/@dev",
