{% load i18n %}
{# Location widget: city search, address, coordinates and a MapLibre map. Plain JS, cfg-* classes (cfg-admin.css). #}
<div class="cfg-locfield"
     data-cfg-locfield
     data-initial="{{ widget.city_data_json }}"
     data-zoom="{{ widget.default_zoom }}"
     data-autocomplete-url="{{ widget.autocomplete_url }}"
     data-nearby-url="{{ widget.nearby_url }}"
     data-reverse-geocode-url="{{ widget.reverse_geocode_url }}">

    <input type="hidden" name="{{ widget.name }}" id="id_{{ widget.name }}" data-ref="city">

    {% if widget.show_map %}
    <div class="cfg-locfield-map">
        <div class="cfg-locfield-canvas" data-ref="map"></div>
        <button type="button" class="cfg-locfield-toggle" data-ref="toggle" title="{% trans 'Expand' %}"
                data-title-expand="{% trans 'Expand' %}" data-title-collapse="{% trans 'Collapse' %}">
            <span class="cfg-icon cfg-icon-sm" data-ref="toggle-icon">open_in_full</span>
        </button>
    </div>
    {% endif %}

    <div class="cfg-locfield-fields">
        <div class="cfg-locfield-search">
            <div class="cfg-locfield-chip" data-ref="chip" role="button" tabindex="0" hidden>
                <span data-ref="chip-flag"></span>
                <span class="cfg-strong" data-ref="chip-name"></span>
                <span class="cfg-muted cfg-small" data-ref="chip-region"></span>
                <button type="button" class="cfg-locfield-clear" data-ref="clear" title="{% trans 'Clear' %}">
                    <span class="cfg-icon cfg-icon-lg">close</span>
                </button>
            </div>
            <div class="cfg-locfield-input" data-ref="search-box">
                <input type="text" class="vTextField" data-ref="search" autocomplete="off"
                       role="combobox" aria-expanded="false" aria-autocomplete="list"
                       placeholder="{% trans 'Search city...' %}">
                <span class="cfg-spinner cfg-locfield-spinner" data-ref="spinner" hidden></span>
            </div>
            <ul class="cfg-locfield-results" data-ref="results" role="listbox" hidden></ul>
        </div>

        <div class="cfg-locfield-row">
            <input type="text" class="vTextField" name="{{ widget.address_field }}" data-ref="address"
                   value="{{ widget.initial_address|default:'' }}" placeholder="{% trans 'Address' %}">
            <input type="text" class="cfg-locfield-coord" name="{{ widget.latitude_field }}" data-ref="lat"
                   value="{{ widget.initial_latitude|default:'' }}" placeholder="Lat">
            <input type="text" class="cfg-locfield-coord" name="{{ widget.longitude_field }}" data-ref="lng"
                   value="{{ widget.initial_longitude|default:'' }}" placeholder="Lng">
        </div>
    </div>
</div>

<script>
(function () {
    if (window.cfgLocationField) { window.cfgLocationField.initAll(); return; }

    var DEFAULT_CENTER = [115, -8];

    function toFlag(code) {
        if (!code || code.length !== 2) return '';
        return String.fromCodePoint.apply(null, code.toUpperCase().split('').map(function (c) { return 127397 + c.charCodeAt(0); }));
    }

    function getJSON(url) {
        return fetch(url, { headers: { 'Accept': 'application/json' }, credentials: 'same-origin' })
            .then(function (r) { return r.json(); });
    }

    function init(root) {
        if (root.dataset.cfgReady) return;
        root.dataset.cfgReady = '1';

        var d = root.dataset;
        var zoom = parseInt(d.zoom, 10) || 12;
        function ref(name) { return root.querySelector('[data-ref="' + name + '"]'); }
        var cityInput = ref('city'), lat = ref('lat'), lng = ref('lng'), address = ref('address');
        var chip = ref('chip'), chipFlag = ref('chip-flag'), chipName = ref('chip-name'), chipRegion = ref('chip-region');
        var clearBtn = ref('clear'), searchBox = ref('search-box'), search = ref('search');
        var spinner = ref('spinner'), list = ref('results');
        var mapEl = ref('map'), toggle = ref('toggle'), toggleIcon = ref('toggle-icon');

        var selected = null;
        try { selected = JSON.parse(d.initial || 'null'); } catch (e) { selected = null; }
        if (selected) {
            selected.region = selected.region || [selected.state_name, selected.country_name].filter(Boolean).join(', ');
            cityInput.value = selected.id || '';
            if (!lat.value && selected.lat != null) lat.value = selected.lat;
            if (!lng.value && selected.lng != null) lng.value = selected.lng;
        }

        var results = [], idx = -1, editing = false, timer = null, map = null, marker = null;

        function render() {
            var showChip = !!selected && !editing;
            chip.hidden = !showChip;
            searchBox.hidden = showChip;
            if (selected) {
                chipFlag.textContent = selected.flag || '';
                chipName.textContent = selected.name || '';
                chipRegion.textContent = selected.region || '';
            }
        }

        function closeList() {
            list.hidden = true;
            search.setAttribute('aria-expanded', 'false');
        }

        function renderList() {
            list.textContent = '';
            results.forEach(function (r, i) {
                var li = document.createElement('li');
                li.setAttribute('role', 'option');
                li.setAttribute('aria-selected', i === idx ? 'true' : 'false');
                [r.flag, r.name, r.region].forEach(function (text, k) {
                    var span = document.createElement('span');
                    span.textContent = text || '';
                    if (k === 1) span.className = 'cfg-medium';
                    if (k === 2) span.className = 'cfg-muted cfg-small';
                    li.appendChild(span);
                });
                // mousedown, not click: it fires before the input loses focus
                li.addEventListener('mousedown', function (e) { e.preventDefault(); select(r); });
                list.appendChild(li);
            });
            list.hidden = results.length === 0;
            search.setAttribute('aria-expanded', results.length ? 'true' : 'false');
        }

        function setMarker(lngLat) {
            if (!map) return;
            if (marker) marker.remove();
            marker = new maplibregl.Marker({ color: '#3b82f6' }).setLngLat(lngLat).addTo(map);
        }

        function flyTo(lngLat, z) {
            if (!map) return;
            map.flyTo({ center: lngLat, zoom: z, duration: 800 });
            setMarker(lngLat);
        }

        function fetchDetails(id) {
            getJSON('/cfg/geo/city/' + id + '/').then(function (c) {
                if (!c.id) return;
                var state = (c.state && c.state.iso2) || c.state_iso2 || '';
                var country = (c.country && c.country.iso2) || c.country_iso2 || '';
                selected = Object.assign({}, selected, {
                    name: c.name,
                    region: [state, country].filter(Boolean).join(', '),
                    flag: toFlag(country)
                });
                if (c.latitude != null) lat.value = c.latitude.toFixed(6);
                if (c.longitude != null) lng.value = c.longitude.toFixed(6);
                render();
            }).catch(function (e) { console.error('location widget: city details failed', e); });
        }

        function findNearbyCity(la, lo) {
            if (!d.nearbyUrl) return;
            getJSON(d.nearbyUrl + '?lat=' + la + '&lng=' + lo + '&limit=1').then(function (data) {
                var city = data.results && data.results[0];
                if (!city) return;
                cityInput.value = city.id;
                selected = Object.assign({}, selected, { id: city.id, flag: city.flag || toFlag(city.country) });
                render();
            }).catch(function (e) { console.error('location widget: nearby city failed', e); });
        }

        function select(r) {
            selected = r;
            editing = false;
            search.value = '';
            results = []; idx = -1;
            closeList();
            if (r.lat != null && r.lng != null) {
                lat.value = r.lat.toFixed(6);
                lng.value = r.lng.toFixed(6);
                flyTo([r.lng, r.lat], zoom);
            }
            if (r.id) {
                cityInput.value = r.id;
                fetchDetails(r.id);
            } else {
                // A Photon-only place: attach the nearest known city
                cityInput.value = '';
                if (r.lat != null && r.lng != null) findNearbyCity(r.lat, r.lng);
            }
            render();
        }

        function runSearch() {
            var q = search.value.trim();
            if (q.length < 2) { results = []; renderList(); return; }
            spinner.hidden = false;
            idx = -1;
            getJSON(d.autocompleteUrl + '?q=' + encodeURIComponent(q)).then(function (data) {
                results = (data.results || []).map(function (x) {
                    var placeId = x.place_id || '';
                    var parts = (x.text || '').split(', ');
                    var country = parts.length > 1 ? parts[parts.length - 1] : '';
                    return {
                        id: placeId.indexOf('local:') === 0 ? parseInt(placeId.split(':')[1], 10) : null,
                        name: parts[0],
                        region: parts.slice(1).join(', '),
                        flag: toFlag(country),
                        lat: x.latitude,
                        lng: x.longitude
                    };
                });
                renderList();
            }).catch(function (e) { console.error('location widget: search failed', e); })
              .then(function () { spinner.hidden = true; });
        }

        function startEdit() {
            editing = true;
            search.value = '';
            results = [];
            renderList();
            render();
            search.focus();
        }

        function cancelEdit() {
            editing = false;
            search.value = '';
            results = [];
            closeList();
            render();
        }

        function clear() {
            selected = null;
            cityInput.value = '';
            lat.value = '';
            lng.value = '';
            editing = false;
            search.value = '';
            results = [];
            closeList();
            if (marker) { marker.remove(); marker = null; }
            if (map) map.flyTo({ center: DEFAULT_CENTER, zoom: 4, duration: 800 });
            render();
        }

        chip.addEventListener('click', startEdit);
        chip.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startEdit(); }
        });
        clearBtn.addEventListener('click', function (e) { e.stopPropagation(); clear(); });

        search.addEventListener('input', function () {
            clearTimeout(timer);
            timer = setTimeout(runSearch, 250);
        });
        search.addEventListener('focus', function () { if (results.length) renderList(); });
        search.addEventListener('blur', function () {
            setTimeout(function () {
                closeList();
                if (selected) { editing = false; render(); }
            }, 150);
        });
        search.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
            else if (e.key === 'Enter') {
                e.preventDefault();  // never submit the admin form from the search box
                if (results.length) select(results[idx >= 0 ? idx : 0]);
            } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (!results.length) return;
                idx = (idx + (e.key === 'ArrowDown' ? 1 : -1) + results.length) % results.length;
                renderList();
            }
        });

        function onCoords() {
            if (!lat.value || !lng.value) return;
            flyTo([parseFloat(lng.value), parseFloat(lat.value)], zoom);
        }
        lat.addEventListener('change', onCoords);
        lng.addEventListener('change', onCoords);

        if (toggle) {
            toggle.addEventListener('click', function (e) {
                e.stopPropagation();
                var expanded = root.classList.toggle('cfg-locfield--expanded');
                toggleIcon.textContent = expanded ? 'close_fullscreen' : 'open_in_full';
                toggle.title = expanded ? toggle.dataset.titleCollapse : toggle.dataset.titleExpand;
                if (map) map.resize();
            });
        }

        if (mapEl && typeof maplibregl !== 'undefined') {
            var hasCoords = lat.value && lng.value;
            var center = hasCoords ? [parseFloat(lng.value), parseFloat(lat.value)] : DEFAULT_CENTER;
            map = new maplibregl.Map({
                container: mapEl,
                style: 'https://tiles.openfreemap.org/styles/liberty',
                center: center,
                zoom: hasCoords ? zoom : 4,
                attributionControl: false
            });
            if (hasCoords) setMarker(center);
            map.on('click', function (e) {
                lat.value = e.lngLat.lat.toFixed(6);
                lng.value = e.lngLat.lng.toFixed(6);
                setMarker([e.lngLat.lng, e.lngLat.lat]);
                if (!d.reverseGeocodeUrl) return;
                getJSON(d.reverseGeocodeUrl + '?lat=' + lat.value + '&lng=' + lng.value).then(function (data) {
                    if (data.address && data.address.street) address.value = data.address.street;
                    if (data.city_id) { cityInput.value = data.city_id; fetchDetails(data.city_id); }
                }).catch(function (err) { console.warn('location widget: reverse geocode failed', err); });
            });
        }

        render();
    }

    window.cfgLocationField = {
        initAll: function () { document.querySelectorAll('[data-cfg-locfield]').forEach(init); }
    };
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', window.cfgLocationField.initAll);
    } else {
        window.cfgLocationField.initAll();
    }
})();
</script>
