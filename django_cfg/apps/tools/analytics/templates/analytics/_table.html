<div class="an-card an-list" x-data="{ open: false, query: '' }">
  <div class="an-card__head">
    <span>{{ title }}</span>
    {% if rows|length > 8 %}<span class="an-muted">Top {{ rows|length }}</span>{% endif %}
  </div>

  {% if rows %}
    {% if rows|length > 8 %}
      <label class="an-list__search"><span class="sr-only">Search {{ title }}</span><input type="search" x-model.debounce.100ms="query" placeholder="Search {{ title|lower }}"></label>
    {% endif %}
    <div class="an-rows">
      {% for row in rows %}
        <div class="an-row" data-label="{{ row.label|lower|escape }}" data-index="{{ forloop.counter0 }}" x-show="$el.dataset.label.includes(query.toLowerCase()) && (query || open || Number($el.dataset.index) < 8)" x-transition.opacity x-cloak>
          <div class="an-row__bar" style="width: {{ row.share }}%"></div>
          <span class="an-row__label" title="{{ row.label|default:'—' }}">{{ row.label|default:"—" }}</span>
          <span class="an-row__count">{{ row.count }}</span>
        </div>
      {% endfor %}
    </div>
    {% if rows|length > 8 %}
      <div class="an-list__footer">
        <span class="an-muted" x-show="query">Matching rows only</span>
        <button type="button" class="an-list__toggle" @click="open = !open; query = ''" x-text="open ? 'Show less' : 'Show all {{ rows|length }}'"></button>
      </div>
    {% endif %}
  {% else %}
    <div class="an-card__empty">No data</div>
  {% endif %}
</div>

<style>
  .an-rows { padding:4px 0; }
  .an-row { position:relative; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 16px; font-size:13px; }
  .an-row__bar { position:absolute; inset:2px auto 2px 8px; background:rgba(0,112,243,.14); border-radius:4px; }
  .an-row__label { position:relative; min-width:0; color:#a1a1a1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .an-row:hover .an-row__label { color:#ededed; }
  .an-row__count { position:relative; flex:none; color:#ededed; font-weight:500; font-variant-numeric:tabular-nums; }
  .an-card__empty { padding:32px 16px; text-align:center; font-size:13px; color:#666; }
  .an-list__search { display:block; padding:10px 12px 2px; }
  .an-list__search input { width:100%; padding:7px 9px; background:#141414; border:1px solid #303030; border-radius:6px; color:#ededed; font:inherit; font-size:12px; }
  .an-list__search input:focus { outline:2px solid #246ec2; outline-offset:1px; }
  .an-list__footer { min-height:42px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 12px; border-top:1px solid #252525; }
  .an-list__toggle { border:0; padding:5px 4px; background:transparent; color:#72afff; font:inherit; font-size:12px; cursor:pointer; }
  .an-list__toggle:hover { color:#aed1ff; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
</style>
