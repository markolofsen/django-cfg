{% if all_tabs %}
<div class="cfg-tabs">
    <nav aria-label="Dashboard tabs">
        {% for tab in all_tabs %}
        <a class="cfg-tab" href="{% url 'django_cfg_dashboard_tab' slug=tab.slug %}"{% if tab.slug == current_tab.slug %} aria-current="page"{% endif %}>
            <span class="material-symbols-outlined cfg-icon-sm" aria-hidden="true">{{ tab.icon }}</span>{{ tab.title }}
        </a>
        {% endfor %}
    </nav>
</div>
{% endif %}
