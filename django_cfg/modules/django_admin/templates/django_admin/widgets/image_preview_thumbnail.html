{% comment %}
Image thumbnail in a changelist cell or readonly field: a plain link to the full image.
{% endcomment %}
<a href="{{ image_url }}" target="_blank" rel="noopener">
    <img class="cfg-thumb" src="{{ image_url }}" alt="{{ alt_text }}" loading="lazy"
         style="max-width: {{ thumbnail_max_width }}; max-height: {{ thumbnail_max_height }}; border-radius: {{ border_radius }}; object-fit: cover;">
</a>
{% if caption %}<div class="cfg-small cfg-muted" style="max-width: {{ thumbnail_max_width }};">{{ caption }}</div>{% endif %}
